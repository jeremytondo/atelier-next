# Every mise task. The three mise config files include this file and differ
# only in the tools their environment can install.

[build]
description = "Build, sign, and ZIP the local macOS app"
run = "scripts/build-app.sh"

[install]
description = "Build and install Atelier in /Applications, preserving the previous app"
run = "scripts/build-app.sh --app-only --install"

[dev]
description = "Build, install, and launch Atelier (quit the running app first)"
run = "scripts/build-app.sh --app-only --install --launch"

[test]
description = "Run native helper and JavaScript behavior tests"
depends = ["test:js", "test:native"]

["test:js"]
description = "Run JavaScript behavior tests immediately"
run = "node --test App/Tests/JavaScript/*.test.js"

["test:native"]
description = "Build and run native helper tests in Debug"
run = "scripts/build-helpers.sh --test"

["test:release"]
description = "Test release behavior with disposable history and fake credentials"
run = "scripts/release-test.sh"

["test:build"]
description = "Test build reuse, preparation recovery, and cache handling"
run = "scripts/build-test.sh"

[lint]
description = "Lint scripts and workflows; check JavaScript and Swift formatting and lint"
depends = ["lint:scripts", "lint:js", "lint:swift"]

["lint:scripts"]
description = "Lint shell scripts and explicitly selected workflows (including jj workspaces)"
run = ["shellcheck scripts/*.sh", "actionlint .github/workflows/*.yml"]

["lint:js"]
description = "Check JavaScript formatting and lint with Biome"
run = "biome ci --error-on-warnings App"

["lint:swift"]
description = "Check Swift formatting with the selected Xcode's swift-format"
run = "xcrun swift-format lint --strict --recursive App/Package.swift App/Sources App/Tests App/Hammerspoon"

[format]
description = "Format JavaScript and Swift sources in place and apply safe lint fixes"
run = [
  "biome check --write App",
  "xcrun swift-format format --in-place --recursive App/Package.swift App/Sources App/Tests App/Hammerspoon",
]

["helpers:build"]
description = "Build or verify Release helper executables"
run = "scripts/build-helpers.sh"

["hs2:build"]
description = "Build the pinned Hammerspoon 2 application with Atelier integration"
run = "scripts/build-hammerspoon.sh"

["native:build"]
description = "Prepare verified host and Release helper outputs"
depends = ["hs2:build", "helpers:build"]

["native:check"]
description = "Sequence Debug tests before Release helper compilation"
depends = ["test:native"]
run = "scripts/build-helpers.sh"

["bundle:check"]
description = "Assemble, ad-hoc sign, and probe current resources with verified native outputs"
depends = ["native:build"]
run = "scripts/build-app.sh --skip-build --app-only --identity - --output-dir .build/bundle-check"

[check]
description = "Run the complete gate, including an isolated real-bundle probe"
depends = ["check:portable", "check:native"]

["check:portable"]
description = "The gate's Linux-capable half: JavaScript tests, lint, and release/build fixtures"
depends = ["test:js", "release:check"]

["check:native"]
description = "The gate's macOS half: Swift format, native tests, and the real-bundle probe"
depends = ["lint:swift", "native:check", "hs2:build"]
run = "scripts/build-app.sh --skip-build --app-only --identity - --output-dir .build/bundle-check"

[refs]
description = "Fetch missing read-only reference source into repos/ (gitignored)"
run = "scripts/refs.sh fetch"

["refs:update"]
description = "Update reference checkouts from upstream main (requires clean checkouts)"
run = "scripts/refs.sh update"

["refs:status"]
description = "Show reference checkout revisions and local changes"
run = "scripts/refs.sh status"

["release:patch"]
description = "Dispatch a stable patch release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh patch"

["release:minor"]
description = "Dispatch a stable minor release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh minor"

["release:major"]
description = "Dispatch a stable major release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh major"

["release:dev"]
description = "Dispatch the rolling dev release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh dev"

["release:plan"]
description = "Print release metadata: dev [BRANCH] or stable patch|minor|major [BRANCH]"
run = "scripts/release-plan.sh"

["release:package"]
description = "Build, sign, notarize, and package an existing release plan JSON"
run = "scripts/build-app.sh --release-plan"

["release:verify-package"]
description = "Run the full gate, then package its verified same-run native outputs"
depends = ["check"]
run = "scripts/build-app.sh --skip-build --release-plan"

["release:publish"]
description = "Publish verified release assets (used by GitHub Actions)"
run = "scripts/publish-release.sh"

["release:check"]
description = "Lint scripts, workflows, and JavaScript, and test release and build behavior"
depends = ["lint:scripts", "lint:js", "test:release", "test:build"]
