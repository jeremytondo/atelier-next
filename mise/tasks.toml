# Every mise task. The three mise config files include this file and differ
# only in the tools their environment can install.

[build]
description = "Build the package in dist/: compiled TypeScript, declarations, CLI, signed providers"
run = "scripts/build-package.sh"

[dev]
description = "Build and install the package into the Homebrew prefix, then reload Hammerspoon 2 yourself"
run = "scripts/build-package.sh --install"

[test]
description = "Run the TypeScript and Swift provider tests"
depends = ["test:js", "test:native"]

["test:js"]
description = "Type-check against the pinned HS2 declarations, then run the TypeScript tests"
run = [
  "scripts/fetch-types.sh",
  "tsc -p tsconfig.json --noEmit",
  "node --test 'tests/*.test.ts'",
]

["test:native"]
description = "Build and run the Swift provider tests in Debug"
run = "scripts/build-providers.sh --test"

["test:release"]
description = "Test release behavior with disposable history and a fake GitHub"
run = "scripts/release-test.sh"

["test:build"]
description = "Test providers build reuse and cache handling with a fake compiler"
run = "scripts/build-test.sh"

["test:cli"]
description = "Test the atelier command against a fake Mac"
run = "scripts/cli-test.sh"

[lint]
description = "Lint scripts and workflows; check TypeScript and Swift formatting and lint"
depends = ["lint:scripts", "lint:js", "lint:swift"]

["lint:scripts"]
description = "Lint shell scripts and the workflows"
run = ["shellcheck scripts/*.sh cli/atelier install/install.sh", "actionlint .github/workflows/*.yml"]

["lint:js"]
description = "Check TypeScript and JavaScript formatting and lint with Biome"
run = "biome ci --error-on-warnings ."

["lint:swift"]
description = "Check Swift formatting with the selected Xcode's swift-format"
run = "xcrun swift-format lint --strict --recursive providers/Package.swift providers/Sources providers/Tests"

[format]
description = "Format TypeScript, JavaScript, and Swift sources in place and apply safe lint fixes"
run = [
  "biome check --write .",
  "xcrun swift-format format --in-place --recursive providers/Package.swift providers/Sources providers/Tests",
]

["providers:build"]
description = "Build or verify the Release atelier-providers executable"
run = "scripts/build-providers.sh"

["native:check"]
description = "Sequence Debug tests before Release providers compilation"
depends = ["test:native"]
run = "scripts/build-providers.sh"

["types:fetch"]
description = "Fetch upstream's hammerspoon.d.ts for the pinned revision into .build/types"
run = "scripts/fetch-types.sh"

["hs2:build"]
description = "Dev only: build stock Hammerspoon 2 at the pinned revision into .build/native/hs2"
run = "scripts/build-hammerspoon.sh"

["hs2:install"]
description = "Dev only: build stock Hammerspoon 2 at the pin and replace /Applications/Hammerspoon 2.app (quit it first)"
run = "scripts/build-hammerspoon.sh --install"

[casks]
description = "Preview the generated Homebrew casks in dist/casks: [MANIFEST.json]"
run = "scripts/casks.sh dist/casks"

[check]
description = "Run the complete gate"
depends = ["check:portable", "check:native"]

["check:portable"]
description = "The gate's Linux-capable half: TypeScript tests, lint, and release/build/CLI fixtures"
depends = ["test:js", "release:check"]

["check:native"]
description = "The gate's macOS half: Swift format, provider tests, and a locally signed package"
depends = ["lint:swift", "native:check"]
run = "scripts/build-package.sh --skip-build --identity - --output-dir .build/package-check"

[refs]
description = "Fetch missing read-only reference source into repos/ (gitignored)"
run = "scripts/refs.sh fetch"

["refs:update"]
description = "Update reference checkouts from upstream main (requires clean checkouts)"
run = "scripts/refs.sh update"

["refs:status"]
description = "Show reference checkout revisions and local changes"
run = "scripts/refs.sh status"

["release:patch"]
description = "Dispatch a stable patch release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh patch"

["release:minor"]
description = "Dispatch a stable minor release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh minor"

["release:major"]
description = "Dispatch a stable major release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh major"

["release:dev"]
description = "Dispatch a dev release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh dev"

["release:plan"]
description = "Print release metadata: dev [BRANCH] or stable patch|minor|major [BRANCH]"
run = "scripts/release-plan.sh"

["release:package"]
description = "Build, sign, notarize, and package an existing release plan JSON"
run = "scripts/build-package.sh --release-plan"

["release:verify-package"]
description = "Run the full gate, then package its verified same-run providers output"
depends = ["check"]
run = "scripts/build-package.sh --skip-build --release-plan"

["release:publish"]
description = "Publish verified release assets and push the casks (used by GitHub Actions)"
run = "scripts/publish-release.sh"

["release:check"]
description = "Lint scripts, workflows, and TypeScript, and test release, build, and CLI behavior"
depends = ["lint:scripts", "lint:js", "test:release", "test:build", "test:cli"]
