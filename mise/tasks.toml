# Every mise task. Both mise config files include this file and differ only in
# the tools their environment can install.

[test]
description = "Build and run the Swift package tests in Debug"
run = "scripts/build-native.sh --test"

["test:build"]
description = "Test native build reuse and cache handling with fake compilers"
run = "scripts/build-test.sh"

[lint]
description = "Lint scripts and workflows; check Swift formatting"
depends = ["lint:scripts", "lint:swift"]

["lint:scripts"]
description = "Lint shell scripts and the workflows"
run = ["shellcheck scripts/*.sh", "actionlint .github/workflows/*.yml"]

["lint:swift"]
description = "Check Swift formatting with the selected Xcode's swift-format"
run = "xcrun swift-format lint --strict --recursive providers/Package.swift providers/Sources providers/Tests companion/Package.swift companion/Sources companion/Tests companion/App/Sources"

[format]
description = "Format Swift sources in place"
run = "xcrun swift-format format --in-place --recursive providers/Package.swift providers/Sources providers/Tests companion/Package.swift companion/Sources companion/Tests companion/App/Sources"

["native:build"]
description = "Build or verify the Release Atelier.app, unsigned, with the providers executable inside"
run = "scripts/build-native.sh"

["native:check"]
description = "Sequence Debug tests before Release native compilation"
depends = ["test"]
run = "scripts/build-native.sh"

[check]
description = "Run the complete gate"
depends = ["check:portable", "check:native"]

["check:portable"]
description = "The gate's Linux-capable half: script and workflow lint, and the build fixtures"
depends = ["lint:scripts", "test:build"]

["check:native"]
description = "The gate's macOS half: Swift format, native tests, and the Release build"
depends = ["lint:swift", "native:check"]
