[tools]
"npm:xcodebuildmcp" = "2.6.2"
node = "26.4.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[vars]
swift_sources = "Package.swift Sources Tests App/Sources"

[tasks.build]
description = "Build Atelier.app into .build/xcode and the atelier command into .build/debug"
# Both use the package's build folder, so not side by side in the gate.
wait_for = ["test"]
run = [
  "scripts/build-app.sh",
  "xcodebuildmcp swift-package build --package-path . --configuration debug",
]

[tasks.dev]
description = "Build, then open the development Atelier.app"
depends = ["build"]
run = "open .build/xcode/Build/Products/Debug/Atelier.app"

[tasks.test]
description = "Run the Swift tests"
depends = ["test:release"]
# Raw, since the summary alone gives only how many tests failed when what
# failed was an expectation: not which, nor what it found.
run = "xcodebuildmcp swift-package test --package-path . --configuration debug --output raw"

[tasks."test:release"]
description = "Test release behavior with disposable history and fake services"
run = "scripts/release-test.sh"

[tasks.lint]
description = "Lint scripts and workflows; check Swift formatting and lint"
run = [
  "shellcheck scripts/*.sh",
  "actionlint .github/workflows/*.yml",
  "xcrun swift-format lint --strict --recursive {{vars.swift_sources}}",
]

[tasks.format]
description = "Format Swift sources in place"
run = "xcrun swift-format format --in-place --recursive {{vars.swift_sources}}"

[tasks.check]
description = "Run the complete gate"
depends = ["lint", "test", "build"]

[tasks.package]
description = "Build the signed Atelier.app that ships into dist/, without notarizing or publishing it"
run = "scripts/package.sh 0.0.0 $(date -u +%Y%m%d%H%M%S) --skip-notarization"

[tasks.release]
description = "Start a release on GitHub of a branch as it is there; nothing local is pushed"
usage = '''
arg "<bump>" help="A development build, or the next stable version" {
  choices "dev" "patch" "minor" "major"
}
arg "[branch]" help="The branch to release" default="main"
'''
run = 'scripts/release-dispatch.sh "$usage_bump" "$usage_branch"'

[tasks."release:dev"]
description = "Start a development release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh dev"

[tasks."release:patch"]
description = "Start a stable patch release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh patch"

[tasks."release:minor"]
description = "Start a stable minor release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh minor"

[tasks."release:major"]
description = "Start a stable major release: [BRANCH] (default: main)"
run = "scripts/release-dispatch.sh major"
