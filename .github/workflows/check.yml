name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atelier-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_OVERRIDE_CONFIG_FILENAMES: mise.portable.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.6.14
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run check:portable

  native:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.6.14
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - id: inputs
        run: echo "providers=$(scripts/native-inputs.sh providers)" >> "$GITHUB_OUTPUT"
      - name: Restore Release providers
        id: providers
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/cache/providers.tar.gz
          key: atelier-providers-v1-${{ steps.inputs.outputs.providers }}
      - name: Unpack native output
        run: scripts/native-cache.sh unpack
      - name: Native checks and package assembly
        run: mise run check:native
      # GitHub scopes PR caches to the PR merge ref; main cannot restore them.
      # Release compiles its own output and never restores executable caches.
      - name: Pack reusable output
        if: steps.providers.outputs.cache-hit != 'true'
        run: scripts/native-cache.sh pack
      - name: Save Release providers
        if: steps.providers.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/cache/providers.tar.gz
          key: atelier-providers-v1-${{ steps.inputs.outputs.providers }}
