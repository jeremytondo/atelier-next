name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atelier-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_OVERRIDE_CONFIG_FILENAMES: mise.portable.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.6.14
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run check

  native:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.6.14
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - id: inputs
        run: |
          host=$(scripts/native-inputs.sh host)
          helpers=$(scripts/native-inputs.sh helpers)
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "helpers=$helpers" >> "$GITHUB_OUTPUT"
      - name: Restore unsigned host
        id: host
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/cache/host.tar.gz
          key: atelier-host-v1-${{ steps.inputs.outputs.host }}
      - name: Restore Release helpers
        id: helpers
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/cache/helpers.tar.gz
          key: atelier-helpers-v1-${{ steps.inputs.outputs.helpers }}
      - name: Unpack native outputs
        run: |
          scripts/native-cache.sh unpack host
          scripts/native-cache.sh unpack helpers
      - name: Native checks and real-bundle probe
        run: mise run check:native
      # GitHub scopes PR caches to the PR merge ref; main cannot restore them.
      # Release compiles its own outputs and never restores executable caches.
      - name: Pack reusable outputs
        env:
          HOST_CACHE_HIT: ${{ steps.host.outputs.cache-hit }}
          HELPERS_CACHE_HIT: ${{ steps.helpers.outputs.cache-hit }}
        run: |
          if [[ "$HOST_CACHE_HIT" != true ]]; then
            scripts/native-cache.sh pack host
          fi
          if [[ "$HELPERS_CACHE_HIT" != true ]]; then
            scripts/native-cache.sh pack helpers
          fi
      - name: Save unsigned host
        if: steps.host.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/cache/host.tar.gz
          key: atelier-host-v1-${{ steps.inputs.outputs.host }}
      - name: Save Release helpers
        if: steps.helpers.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/cache/helpers.tar.gz
          key: atelier-helpers-v1-${{ steps.inputs.outputs.helpers }}
