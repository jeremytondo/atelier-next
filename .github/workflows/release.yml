# Both channels are manually dispatched from repository branches: versioned dev
# releases and permanent stable SemVer releases. Never cancel midway through publication.
name: Atelier Release
run-name: Atelier Release (${{ inputs.bump }}, ${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Publish a dev release or cut a stable semantic release from the selected branch
        type: choice
        default: dev
        options: [dev, patch, minor, major]
        required: true

permissions:
  contents: read

concurrency:
  group: atelier-release-${{ inputs.bump == 'dev' && 'dev' || 'stable' }}
  cancel-in-progress: false

jobs:
  package:
    # Only manual branch dispatches can use the release environment. No PR/tag builds.
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      packaged: ${{ steps.package.outputs.packaged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Both channels derive their version from the stable tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.6.14
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$RELEASE_BUMP" == dev ]]; then
            mise run release:plan dev > release-plan.json
          else
            mise run release:plan stable "$RELEASE_BUMP" > release-plan.json
          fi

      - name: Preflight, check, build once, sign, and notarize
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATELIER_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.ATELIER_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          ATELIER_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.ATELIER_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          ATELIER_APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.ATELIER_APP_STORE_CONNECT_KEY_BASE64 }}
          ATELIER_APP_STORE_CONNECT_KEY_ID: ${{ vars.ATELIER_APP_STORE_CONNECT_KEY_ID }}
          ATELIER_APP_STORE_CONNECT_ISSUER_ID: ${{ vars.ATELIER_APP_STORE_CONNECT_ISSUER_ID }}
        run: scripts/ci-release.sh release-plan.json --output-dir dist/release

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.package.outputs.packaged == 'true'
        with:
          name: atelier-release
          path: |
            dist/release/atelier-*-macos-arm64.tar.gz
            dist/release/manifest.json
            dist/release/checksums.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload notarization failure details
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: atelier-notarization-logs
          path: dist/release/notarization
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: package
    if: needs.package.outputs.packaged == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_OVERRIDE_CONFIG_FILENAMES: mise.publish.toml
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: atelier-release
          path: dist/release

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.6.14
          cache_key_prefix: atelier-publish-tools-v1
          install_args: gh jq
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified assets and push the casks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATELIER_TAP_TOKEN: ${{ secrets.ATELIER_TAP_TOKEN }}
        run: mise run release:publish dist/release
