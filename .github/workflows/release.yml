# Both channels are manually dispatched from main: mutable dev and permanent
# stable SemVer releases. Never cancel midway through updating release assets.
name: Atelier Release
run-name: Atelier Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Refresh dev or cut a stable semantic release from main
        type: choice
        default: dev
        options: [dev, patch, minor, major]
        required: true

permissions:
  contents: read

concurrency:
  group: atelier-release-${{ inputs.bump == 'dev' && 'dev' || 'stable' }}
  cancel-in-progress: false

jobs:
  package:
    # Dispatch only trusted main, where the release workflow and signing code live.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check app and release automation
        run: mise run check

      - name: Plan release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$RELEASE_BUMP" == dev ]]; then
            mise run release:plan dev > release-plan.json
          else
            mise run release:plan stable "$RELEASE_BUMP" > release-plan.json
          fi

      - name: Build, sign, notarize, and package
        env:
          ATELIER_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.ATELIER_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          ATELIER_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.ATELIER_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          ATELIER_APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.ATELIER_APP_STORE_CONNECT_KEY_BASE64 }}
          ATELIER_APP_STORE_CONNECT_KEY_ID: ${{ vars.ATELIER_APP_STORE_CONNECT_KEY_ID }}
          ATELIER_APP_STORE_CONNECT_ISSUER_ID: ${{ vars.ATELIER_APP_STORE_CONNECT_ISSUER_ID }}
        run: scripts/ci-signing.sh mise run release:package release-plan.json --output-dir dist/release

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: atelier-release
          path: |
            dist/release/Atelier-macos-arm64.zip
            dist/release/manifest.json
            dist/release/checksums.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload notarization failure details
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: atelier-notarization-logs
          path: dist/release/notarization
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: package
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: atelier-release
          path: dist/release

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:publish dist/release
